services:
  auth-database:
    image: postgres:17
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5432:5432"
    volumes:
      - auth-database-data:/var/lib/postgresql/data
  pgAdmin:
    image: dpage/pgadmin4
    depends_on:
      - auth-database
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: chat-platform/auth-service:local
    container_name: auth-service
    ports:
      - "8083:8083"
    depends_on:
      - auth-database
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-database:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: local_password
  chat-server:
    build:
      context: .
      dockerfile: chat-server/Dockerfile
    image: chat-platform/chat-server:local
    container_name: chat-server
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      CHAT_SERVER_PORT: 8080
      SERVER_PORT: 8081
    depends_on:
      - auth-service
  chat-client:
    build:
      context: .
      dockerfile: chat-client/Dockerfile
    image: chat-platform/chat-client:local
    container_name: chat-client
    ports:
      - "8082:8082"
    environment:
      CHAT_SERVER_HOST: chat-server
      CHAT_SERVER_PORT: 8080
      SERVER_PORT: 8082
    depends_on:
      - chat-server
      - auth-service