services:
  auth-database:
    image: postgres:17
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth_user -d auth_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - auth-database-data:/var/lib/postgresql/data
  pgAdmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: local_admin_password
    ports:
      - "5050:80"
    depends_on:
      auth-database:
        condition: service_healthy
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: chat-platform/auth-service:local
    container_name: auth-service
    ports:
      - "8083:8083"
    depends_on:
      - auth-database
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-database:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: auth_password
volumes:
  auth-database-data: