
include:
  - auth-service/compose.yaml
  - chat-client/compose.yaml
services:
  chat-server:
    build:
      context: .
      dockerfile: chat-server/Dockerfile
    image: chat-platform/chat-server:local
    container_name: chat-server
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      CHAT_SERVER_PORT: 8080
      SERVER_PORT: 8081
    depends_on:
      - auth-service
volumes:
  auth-database-data: