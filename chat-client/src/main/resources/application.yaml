chat:
  server:
    host: ${CHAT_SERVER_HOST:localhost}
    port: ${CHAT_SERVER_PORT:8080}

server:
  port: ${SERVER_PORT:8082}
  servlet:
    session:
      cookie:
        name: CLIENT_CHAT_SESSION
        path: /
        http-only: true
        same-site: lax
services:
  auth-service:
    base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8083}
# chat-client
security:
  jwt:
    public-key-file: "file:../dev-keys/public.pem"
    audience: chat-client
    issuer: http://auth-service:8083
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chat_client_db}
    username: ${SPRING_DATASOURCE_USERNAME:chat_client_user}
    password: ${SPRING_DATASOURCE_PASSWORD:chat_client_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}