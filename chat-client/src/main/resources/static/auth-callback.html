<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1"
    >

    <title>Public Chat</title>

    <style>
        body {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
        }

        #public-messages {
            min-height: 250px;
            padding: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            list-style: none;
        }

        #public-messages li {
            margin-bottom: 10px;
        }

        #public-message-form {
            display: flex;
            gap: 8px;
        }

        #public-message-input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<p id="status">Completing login...</p>

<section id="public-chat" hidden>
    <h2>Public Chat</h2>

    <ul id="public-messages"></ul>

    <form id="public-message-form">
        <input
                id="public-message-input"
                type="text"
                placeholder="Write a public message"
                autocomplete="off"
                required
        >

        <button type="submit">
            Send
        </button>
    </form>
</section>

<script
        src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js">
</script>

<script>
    const LOGIN_URL =
        "http://localhost:8083/auth/login?app_client_id=chat-client";

    const TOKEN_EXCHANGE_URL =
        "http://localhost:8083/api/auth/token/exchange";

    const WEBSOCKET_URL =
        "ws://localhost:8082/ws/chat";

    let accessToken = null;
    let stompClient = null;

    async function exchangeLoginCode() {
        const response = await fetch(
            TOKEN_EXCHANGE_URL,
            {
                method: "POST",
                credentials: "include"
            }
        );

        if (!response.ok) {
            throw new Error(
                `Token exchange failed: ${response.status}`
            );
        }

        const tokenResponse = await response.json();

        if (!tokenResponse.accessToken) {
            throw new Error(
                "The exchange response does not contain an access token."
            );
        }

        return tokenResponse;
    }

    function displayPublicMessage(message) {
        const messages =
            document.getElementById("public-messages");

        const messageElement =
            document.createElement("li");

        messageElement.textContent =
            `${message.sender}: ${message.content}`;

        messages.appendChild(messageElement);
    }

    function connectToChat(token) {
        const statusElement =
            document.getElementById("status");

        const publicChat =
            document.getElementById("public-chat");

        stompClient = new StompJs.Client({
            brokerURL: WEBSOCKET_URL,

            connectHeaders: {
                Authorization: `Bearer ${token}`
            },

            debug: message => {
                console.log("[STOMP]", message);
            },

            onConnect: () => {
                console.log(
                    "STOMP connection established"
                );

                stompClient.subscribe(
                    "/topic/public",
                    frame => {
                        try {
                            const receivedMessage =
                                JSON.parse(frame.body);

                            displayPublicMessage(
                                receivedMessage
                            );
                        } catch (error) {
                            console.error(
                                "Could not read received message:",
                                error
                            );
                        }
                    }
                );

                statusElement.textContent =
                    "Connected to public chat.";

                publicChat.hidden = false;

                document
                    .getElementById("public-message-input")
                    .focus();
            },

            onStompError: frame => {
                console.error(
                    "STOMP error:",
                    frame.headers["message"],
                    frame.body
                );

                statusElement.textContent =
                    "The chat server rejected the connection.";

                publicChat.hidden = true;
            },

            onWebSocketError: error => {
                console.error(
                    "WebSocket error:",
                    error
                );

                statusElement.textContent =
                    "Could not connect to the chat server.";

                publicChat.hidden = true;
            },

            onWebSocketClose: () => {
                console.log(
                    "WebSocket connection closed"
                );
            }
        });

        stompClient.activate();
    }

    document
        .getElementById("public-message-form")
        .addEventListener("submit", event => {
            event.preventDefault();

            const input =
                document.getElementById(
                    "public-message-input"
                );

            const text = input.value.trim();

            if (!text) {
                return;
            }

            if (!stompClient?.connected) {
                document.getElementById("status").textContent =
                    "The chat connection is not active.";

                return;
            }

            stompClient.publish({
                destination: "/app/chat/public",

                body: JSON.stringify({
                    text: text
                })
            });

            input.value = "";
            input.focus();
        });

    async function startAuthentication() {
        const statusElement =
            document.getElementById("status");

        try {
            const tokenResponse =
                await exchangeLoginCode();

            accessToken =
                tokenResponse.accessToken;

            console.log(
                "Token type:",
                tokenResponse.tokenType
            );

            console.log(
                "Expires in:",
                tokenResponse.expiresIn
            );

            statusElement.textContent =
                "Login completed. Connecting to chat...";

            connectToChat(accessToken);

        } catch (error) {
            console.error(
                "Authentication failed:",
                error
            );

            statusElement.textContent =
                "Login could not be completed. Redirecting...";

            window.location.replace(LOGIN_URL);
        }
    }

    startAuthentication();
</script>

</body>
</html>
