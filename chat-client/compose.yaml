services:
  chat-client-database:
    image: postgres:17
    container_name: chat-client-database
    environment:
      POSTGRES_DB: ${CHAT_CLIENT_POSTGRES_DB}
      POSTGRES_USER: ${CHAT_CLIENT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CHAT_CLIENT_POSTGRES_PASSWORD}
    volumes:
      - chat-client-database-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-presence-redis:
    image: redis:7-alpine
    container_name: chat-presence-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
  chat-client:
    build:
      context: ..
      dockerfile: chat-client/Dockerfile
    image: chat-platform/chat-client:local
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      CHAT_SERVER_HOST: chat-server
      CHAT_SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://chat-client-database:5432/${CHAT_CLIENT_POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${CHAT_CLIENT_POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${CHAT_CLIENT_POSTGRES_PASSWORD}
      REDIS_HOST: chat-presence-redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: redis-presence
      SECURITY_JWT_PUBLIC_KEY_FILE: file:/dev-keys/public.pem
      SECURITY_JWT_ISSUER: http://auth-service:8083
      SECURITY_JWT_AUDIENCE: chat-client
      AUTH_SERVICE_BASE_URL: http://auth-service:8083
    volumes:
      - ../dev-keys:/dev-keys:ro
    depends_on:
      chat-client-database:
        condition: service_healthy
      chat-server:
        condition: service_started
      auth-service:
        condition: service_started
      chat-presence-redis:
        condition: service_healthy

volumes:
  chat-client-database-data: