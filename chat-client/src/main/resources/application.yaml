chat:
  server:
    host: ${CHAT_SERVER_HOST:localhost}
    port: ${CHAT_SERVER_PORT:8080}

server:
  port: ${SERVER_PORT:8082}

# chat-client
security:
  jwt:
    public-key-file: "file:../dev-keys/public.pem"
    audience: chat-client
    issuer: http://auth-service:8083
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${SPRING_DATASOURCE_USERNAME:auth_user}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true